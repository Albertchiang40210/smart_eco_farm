services:
  # 1. 智慧農場 MySQL 資料庫 (Port: 3308)
  farm_db:
    image: mysql:8.0
    container_name: farm_mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd           
      MYSQL_DATABASE: smart_eco_farm_db       
    ports:
      - "3308:3306"                           
      - farm_db_data:/var/lib/mysql

  # 1.5. 高併發快取 (Redis)
  farm_redis:
    image: redis:7-alpine
    container_name: farm_redis
    restart: "no"
    ports:
      - "6379:6379"

  # 2. 農場 FastAPI 後端大腦 (Port: 8001)
  farm_backend:
    build: .
    container_name: farm_api_service
    restart: "no"
    ports:
      - "8001:8000"                           
    environment:
      - DB_HOST=farm_db
      - MYSQL_HOST=farm_db
      - DATABASE_HOST=farm_db
      - DB_USER=root
      - DB_PASSWORD=P@ssw0rd
      - DB_NAME=smart_eco_farm_db
      - REDIS_HOST=farm_redis
    volumes:
      # 🟢 大腦產出的圖片，透過這個管道同步回 Mac 本機的 ./result
      - ./result:/app/result
      - ./phone_upload_queue:/app/phone_upload_queue
    depends_on:
      - farm_db

  # 3. 農場 React 現代化前端 (Port: 3000)
  react_frontend:
    build: ./frontend
    container_name: react_web_service
    restart: "no"
    ports:
      - "3000:3000"
    depends_on:
      - farm_backend

volumes:
  farm_db_data: