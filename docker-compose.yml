# 使用前：cp .env.example .env 並填入所有 change_me 的值
services:
  farm_db:
    image: mysql:8.0
    container_name: farm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smart_eco_farm_db}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - farm_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  farm_redis:
    image: redis:7-alpine
    container_name: farm_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  farm_backend:
    build: .
    container_name: farm_api_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DB_HOST: farm_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-smart_eco_farm_db}
      REDIS_HOST: farm_redis
      SECRET_KEY: ${SECRET_KEY:?請在 .env 設定 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?請在 .env 設定 ADMIN_PASSWORD}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?請在 .env 設定 DEVICE_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./result:/app/result      # 訓練好的權重與推論結果圖
      - ./logs:/app/logs
    depends_on:
      farm_db:
        condition: service_healthy
      farm_redis:
        condition: service_healthy

  react_frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    container_name: react_web_service
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - farm_backend

volumes:
  farm_db_data:
